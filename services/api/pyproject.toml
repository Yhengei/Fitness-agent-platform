[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fitness-agent-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2",
  "celery[redis]>=5.4,<6", "httpx>=0.27,<1", "langgraph>=0.2,<2",
  "langgraph-checkpoint-postgres>=2,<4", "psycopg-pool>=3.2,<4"
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"
